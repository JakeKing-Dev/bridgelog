<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="referrer" content="no-referrer">

<body>
<title>BridgeLog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone-first app shell. Student bar on top, one view at a time, quick-log buttons always one tap away. */
/* Calm, low-glare palette: soft sage ground, muted lavender-blue accent, clay (not alarm red) for incidents. */
:root{
  --bg:#f1f4f0; --surface:#fbfcf9; --ink:#2e3a3a; --muted:#64706f; --line:#dde4de;
  --accent:#53669c; --accent-ink:#fbfcf9; --accent-soft:#e6e9f4;
  --incident:#925842; --incident-soft:#f4e6de; --win:#427353; --win-soft:#e3efe4;
  --goal:#436c8e; --goal-soft:#e2ecf3; --restore:#775b96; --restore-soft:#eee7f4;
  --care:#38716d; --care-soft:#dcefec;
  --font:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Lexend",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c2228; --surface:#242b32; --ink:#e3e7e4; --muted:#a3aeac; --line:#353e46;
  --accent:#9fb0e0; --accent-ink:#1c2228; --accent-soft:#2c3446;
  --incident:#e0a48b; --incident-soft:#3d2f2a; --win:#97c9a4; --win-soft:#26362c;
  --goal:#96bddb; --goal-soft:#26333e; --restore:#c3acdf; --restore-soft:#332c3d; --care:#8fcfc6; --care-soft:#22373a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c2228; --surface:#242b32; --ink:#e3e7e4; --muted:#a3aeac; --line:#353e46;
  --accent:#9fb0e0; --accent-ink:#1c2228; --accent-soft:#2c3446;
  --incident:#e0a48b; --incident-soft:#3d2f2a; --win:#97c9a4; --win-soft:#26362c;
  --goal:#96bddb; --goal-soft:#26333e; --restore:#c3acdf; --restore-soft:#332c3d; --care:#8fcfc6; --care-soft:#22373a; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16.5px/1.6 var(--font);letter-spacing:.005em}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:1.45rem;font-weight:600;color:var(--accent)}
.brand span{font-size:.8rem;color:var(--muted)}
.local{font:500 .72rem var(--mono);color:var(--accent);background:var(--accent-soft);padding:4px 8px;border-radius:999px}
.studentbar{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
textarea{min-height:64px;resize:vertical}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.studentbar select{font-weight:700}
button{font:500 .95rem var(--font);border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent}
button.small{padding:6px 10px;font-size:.82rem}
.quick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:16px;border-width:0;text-align:left;border-radius:20px}
.quick button small{font-weight:400;font-size:.78rem;opacity:.85}
.ic,.logo{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic{width:30px;height:30px;margin-bottom:6px}
.ic .dot{fill:currentColor}
.logo{width:28px;height:28px;color:var(--accent);align-self:center;stroke-width:2}
.brand{align-items:center}
.q-incident{background:var(--incident-soft);color:var(--incident)}
.q-win{background:var(--win-soft);color:var(--win)}
.q-goal{background:var(--goal-soft);color:var(--goal)}
.q-restore{background:var(--restore-soft);color:var(--restore)}
.q-time{background:var(--accent-soft);color:var(--accent)}
.q-care{background:var(--care-soft);color:var(--care)}
#running{display:flex;flex-direction:column;gap:8px;margin-top:12px}
#running:empty{display:none}
.run{background:var(--surface);border:2px solid var(--accent);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:10px}
.run.alert{border-color:var(--incident);background:var(--incident-soft)}
.run .rh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.run .who{font-size:.8rem;color:var(--muted)}
.run .big{font:500 2.3rem/1.1 var(--mono);font-variant-numeric:tabular-nums}
.run .btns{display:flex;gap:8px;flex-wrap:wrap}
.run .btns button{flex:1 1 120px;padding:14px}
.run button.tap{font-size:1.5rem;padding:20px;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);flex:2 1 160px}
.run .msg{font-size:.9rem}
.ask{display:flex;flex-direction:column;gap:8px;background:var(--accent-soft);border-radius:14px;padding:12px}
.ask b{font-weight:500}
.picker{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.picker button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px}
.picker small{font-weight:400;color:var(--muted);font-size:.78rem}
#breakview{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));text-align:center}
#breakview svg{width:min(70vw,52vh);height:auto}
#breakview .left{font:400 3.2rem var(--mono);font-variant-numeric:tabular-nums}
#breakview .then{font-size:1.5rem;color:var(--muted)}
#breakview .back{position:absolute;top:max(14px,env(safe-area-inset-top,0px));right:max(14px,env(safe-area-inset-right,0px))}
.seq{font:500 1.05rem var(--mono);letter-spacing:.04em;min-height:1.6em;overflow-wrap:anywhere}
.stepq{display:flex;flex-direction:column;gap:6px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.lvl .chip{min-width:38px;padding:7px 8px;text-align:center}
.todo{display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--incident);background:var(--incident-soft);border-radius:14px;padding:12px}
.todo .item{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.todo .done{color:var(--win)}
#print{display:none}
@media print{ body>*:not(#print){display:none!important} #print{display:block!important;color:#000} body{background:#fff!important} }
nav.tabs{display:flex;flex-wrap:wrap;gap:4px;margin-top:18px;border-bottom:1.5px solid var(--line)}
nav.tabs button{border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);padding:12px 14px;min-height:44px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
section.view{padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 160px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.kpi b{display:block;font:400 1.7rem var(--mono);font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi .delta{font:500 .75rem var(--mono)}
.day{margin-top:14px}
.day h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.entry{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:8px}
.entry .stripe{border-radius:4px}
.entry .t{font:500 .78rem var(--mono);color:var(--muted)}
.entry p{margin:2px 0 0;font-size:.92rem;color:var(--muted)}
.entry .head{font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.84rem;border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--surface);cursor:pointer;font-weight:400}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:500}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;font-weight:500;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .lab{display:flex;justify-content:space-between;font-size:.88rem}
.bars .lab span{font:500 .82rem var(--mono);color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.summary{white-space:pre-wrap;font-size:1rem;line-height:1.6}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pill{font:500 .72rem var(--mono);padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-open{background:var(--restore-soft);color:var(--restore)}
.p-kept{background:var(--win-soft);color:var(--win)}
.p-missed{background:var(--incident-soft);color:var(--incident)}
.gridhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.gridhead .legend{margin:0}
.mini{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:3px}
.lg-i{color:var(--incident)} .lg-w{color:var(--win)}
.weeks{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:6px;align-items:stretch}
.dow{font-size:.75rem;color:var(--muted);text-align:center}
.wk-label{font-size:.72rem;color:var(--muted);align-self:center;padding-right:4px;white-space:nowrap}
.day-tile{border-radius:14px;min-height:58px;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg);border:1.5px solid transparent}
.day-tile.good{background:var(--win-soft)} .day-tile.hard{background:var(--incident-soft)} .day-tile.even{background:var(--accent-soft)}
.day-tile.future{opacity:.35} .day-tile.today{border-color:var(--accent)}
.dnum{font-size:.78rem;color:var(--ink)}
.counts{display:flex;gap:6px;flex-wrap:wrap;font-size:.85rem;font-variant-numeric:tabular-nums}
.growth{display:flex;flex-direction:column;gap:5px}
.growth .lab{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.growth .lab b{font-weight:500;color:var(--goal)}
.gbar{height:14px;border-radius:7px;background:var(--goal-soft);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:7px;background:var(--goal)}
.gnote{font-size:.8rem;color:var(--muted)}
@media (max-width:420px){.wk-label{font-size:.64rem}.day-tile{min-height:52px;padding:5px}.counts{font-size:.78rem;gap:3px}.mini{width:13px;height:13px}}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
#lock{position:fixed;inset:0;background:var(--bg);z-index:40;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lockcard{width:min(380px,100%);display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px}
.lockcard .logo{align-self:center}
.lockcard h2{margin:0;font-size:1.3rem;font-weight:500}
.status{display:flex;align-items:center;gap:8px;font-weight:500}
.status i{width:10px;height:10px;border-radius:50%;display:inline-block}
.check-ok{background:var(--win-soft);border-radius:14px;padding:12px 14px;color:var(--ink)}
.check-bad{background:var(--incident-soft);border-radius:14px;padding:12px 14px;color:var(--ink)}
.check-bad ul{margin:6px 0 0;padding-left:18px}
.kv{display:grid;grid-template-columns:minmax(90px,34%) minmax(0,1fr);gap:10px;font-size:.92rem;padding:6px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--muted)} .kv b{font-weight:400;overflow-wrap:anywhere}
.addendum{border-left:3px solid var(--accent);padding:2px 0 2px 12px} .addendum p{margin:2px 0 0}
.entry.voided{opacity:.6} .entry.voided .head{text-decoration:line-through}
dialog{border:0;border-radius:24px;padding:0;width:min(560px,calc(100vw - 24px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(40,50,55,.35)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
dialog h2{margin:0;font-size:1.2rem}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:11px 18px;border-radius:999px;font-size:.9rem;z-index:20}
.confirm{border-radius:16px;border:1.5px solid var(--incident);background:var(--incident-soft);color:var(--incident);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:620px){
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quick button{padding:14px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}

</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 15h19"/><path d="M4 15C6.5 7.5 17.5 7.5 20 15"/><path d="M8.5 15v-4.4M12 15V9.4M15.5 15v-4.4"/><path d="M6 15v5M18 15v5"/></svg><b>BridgeLog</b><span>behavior, progress and repair, in one timeline</span></div>
    <span class="local" title="Nothing is sent anywhere. Back up from the Data tab.">● Saved on this device only</span>
  </header>

  <div class="studentbar">
    <label for="student" class="f" style="flex:1 1 220px">Student
      <select id="student" aria-label="Choose student"></select>
    </label>
    <button id="addStudentBtn" class="ghost" style="align-self:flex-end">+ Student</button>
  </div>

  <div id="running"></div>
  <div class="quick" role="group" aria-label="Quick log">
    <button class="q-incident" data-log="incident"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 9.4 4.3 4.3 0 0 0 7 18z"/></svg>Incident<small>what happened, before & after</small></button>
    <button class="q-win" data-log="win"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 8.2 9.4 5.5 5 5.5c0 4.2 2.8 6.5 7 6.5z"/><path d="M12 14.5c0-3.3 2.4-5.5 6.5-5.5 0 3.7-2.6 5.5-6.5 5.5z"/></svg>Win<small>a success worth noting</small></button>
    <button class="q-goal" data-log="goal"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" class="dot"/></svg>Goal data<small>score toward a goal</small></button>
    <button class="q-time" data-log="time"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13.5" r="7.5"/><path d="M12 9.5v4l2.6 2.4"/><path d="M9.5 2.8h5"/><path d="M12 2.8V6"/></svg>Count & time<small>tally, duration, intervals, breaks</small></button>
    <button class="q-care" data-log="care"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20s-7-4.3-7-9.8A3.9 3.9 0 0 1 12 7.8a3.9 3.9 0 0 1 7 2.4C19 15.7 12 20 12 20z"/></svg>Supports<small>prompt levels, care, seizures, emergencies</small></button>
    <button class="q-restore" data-log="restore"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 15h19"/><path d="M4 15C6.5 7.5 17.5 7.5 20 15"/><path d="M8.5 15v-4.4M12 15V9.4M15.5 15v-4.4"/><path d="M6 15v5M18 15v5"/></svg>Restorative<small>conversation & agreement</small></button>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="timeline" aria-selected="true">Timeline</button>
    <button role="tab" data-tab="patterns" aria-selected="false">Patterns</button>
    <button role="tab" data-tab="repair" aria-selected="false">Restorative</button>
    <button role="tab" data-tab="summary" aria-selected="false">Summary</button>
    <button role="tab" data-tab="data" aria-selected="false">Data</button>
  </nav>

  <section class="view" id="v-timeline"></section>
  <section class="view" id="v-patterns" hidden></section>
  <section class="view" id="v-repair" hidden></section>
  <section class="view" id="v-summary" hidden></section>
  <section class="view" id="v-data" hidden></section>
</div>

<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<div id="breakview" hidden></div>
<div id="print"></div>
<div id="lock" hidden>
  <form id="lockForm" class="lockcard" autocomplete="off">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true" style="width:44px;height:44px"><path d="M2.5 15h19"/><path d="M4 15C6.5 7.5 17.5 7.5 20 15"/><path d="M8.5 15v-4.4M12 15V9.4M15.5 15v-4.4"/><path d="M6 15v5M18 15v5"/></svg>
    <h2>BridgeLog is locked</h2>
    <p style="margin:0;color:var(--muted)">Enter your passcode to open your logs.</p>
    <label class="f" for="lockPass">Passcode<input id="lockPass" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Unlock</button>
    <p id="lockMsg" role="status" style="margin:0;min-height:1.4em;color:var(--incident)"></p>
    <button type="button" class="ghost small" id="lockForgot">Forgot passcode?</button>
    <div id="lockConfirm" class="confirm" hidden>The data is encrypted with your passcode, so it can't be recovered without it. You can erase this device and restore an older backup instead.
      <button type="button" class="small" id="lockErase">Erase this device</button><button type="button" class="small ghost" id="lockKeep">Keep trying</button></div>
  </form>
</div>

<script>
// ---------------- vocab ----------------
const ANTECEDENTS = ["Demand or task given","Transition","Told no / item denied","Peer conflict","Unstructured time","Adult attention elsewhere","Noise or crowding","Change in routine","Other"];
const CONSEQUENCES = [
  ["Redirected to task","none"],["Break given","escape"],["Task removed or changed","escape"],["Left the area","escape"],
  ["Adult attention / talk","attention"],["Peer attention","attention"],["Item or activity given","tangible"],
  ["Planned ignoring","none"],["Continued without response","none"],["Other","none"]];
const FUNCTIONS = {escape:"Escape or avoid something",attention:"Get attention",tangible:"Get an item or activity",sensory:"Sensory / automatic"};
const ACTIVITIES = ["Arrival","Morning work","Reading","Math","Specials","Lunch","Recess","Small group","Independent work","Dismissal","Other"];

const KEY = "bridgelog.v1";

const META = "bridgelog.meta";
let cryptoKey = null, saltB64 = null, locked = false, saveChain = Promise.resolve();
function getMeta(){ try{ return JSON.parse(localStorage.getItem(META)||"{}"); }catch(e){ return {}; } }
function setMeta(patch){ try{ localStorage.setItem(META, JSON.stringify({...getMeta(), ...patch})); }catch(e){} }
const toB64 = buf => { const b=new Uint8Array(buf); let s=""; for (let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(s); };
const fromB64 = str => Uint8Array.from(atob(str), c=>c.charCodeAt(0));
async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:210000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function seal(obj, key=cryptoKey, salt=saltB64){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return {bridgelog:1, enc:"AES-GCM-256", kdf:"PBKDF2-SHA256-210000", salt, iv:toB64(iv), data:toB64(ct)};
}
async function unseal(env, key){ const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:fromB64(env.iv)}, key, fromB64(env.data)); return JSON.parse(new TextDecoder().decode(pt)); }
// Returns "empty", "plain", or the encrypted envelope (which needs the passcode).
function load(){ try{ const s=localStorage.getItem(KEY); if(!s) return "empty"; const o=JSON.parse(s); if (o && o.enc) return o; db=o; return "plain"; }catch(e){ return "empty"; } }
function askPersist(){
  const m=getMeta(); if (m.persistAsked || !navigator.storage?.persist) return;
  if (!db.students.some(x=>!x.sample)) return;
  setMeta({persistAsked:true}); navigator.storage.persist().then(ok=>setMeta({persisted:ok})).catch(()=>{});
}
function save(){
  if (locked) return saveChain;
  try{ askPersist(); }catch(e){}           // never overwrite stored data while the app is locked
  const snapshot = db, key = cryptoKey, salt = saltB64;
  saveChain = saveChain.then(async ()=>{ try{ await extendChain(snapshot); localStorage.setItem(KEY, JSON.stringify(key ? await seal(snapshot, key, salt) : snapshot)); }
    catch(e){ toast("Couldn't save on this device. Download a backup from the Data tab."); } });
  return saveChain;
}
// ---- passcode lock
let lastActive = Date.now();
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,()=>{ lastActive=Date.now(); }, {passive:true}));
const lockMinutes = () => getMeta().lockMinutes || 5;
// A seizure or break timer has to stay on screen, so those keep the app unlocked. Other timers don't. "Lock now" always works.
const idleLock = () => cryptoKey && !locked && !(db.running||[]).some(r=>r.kind==="seizure"||r.kind==="break") && Date.now()-lastActive > lockMinutes()*60e3;
setInterval(()=>{ if (idleLock()) lockNow(); }, 20e3);
document.addEventListener("visibilitychange",()=>{ if (document.visibilityState==="visible" && idleLock()) lockNow(); });
async function lockNow(){
  await saveChain;
  let env; try{ env = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if (!env || !env.enc) return;
  if (dlg.open) dlg.close();
  locked = true; cryptoKey = null; showSupports = null; db = {students:[], entries:[], current:null};
  document.querySelectorAll("section.view").forEach(sec=>sec.replaceChildren());   // drop every rendered record, not just the visible tab
  render(); showLock(env);
}
function showLock(env){
  locked = true;
  const box = $("#lock"); box.hidden = false;
  const inp = $("#lockPass"), msg = $("#lockMsg"); inp.value=""; msg.textContent=""; setTimeout(()=>inp.focus(), 50);
  $("#lockForm").onsubmit = async e => { e.preventDefault(); msg.textContent="Unlocking…";
    try{ const key = await deriveKey(inp.value, fromB64(env.salt)); const d = await unseal(env, key);
      cryptoKey=key; saltB64=env.salt; db=d; locked=false; lastActive=Date.now(); box.hidden=true; inp.value=""; render(); checkChainOnOpen(); }
    catch(err){ msg.textContent="That passcode didn't work. Try again."; inp.select(); } };
  $("#lockForgot").onclick = () => { const c=$("#lockConfirm"); c.hidden=false; };
  $("#lockErase").onclick = () => { try{ localStorage.removeItem(KEY); }catch(e){} cryptoKey=null; saltB64=null; locked=false; db={students:[],entries:[],current:null};
    $("#lockConfirm").hidden=true; box.hidden=true; render(); toast("Erased. You can restore a backup from the Data tab."); };
  $("#lockKeep").onclick = () => { $("#lockConfirm").hidden=true; };
}

  const orig=P[m]; P[m]=function(...k){ return orig.apply(this, k.filter(x=>x!=null && x!==false)); }; }
function el(tag, attrs={}, ...kids){ const e=document.createElement(tag);
  for (const k in attrs){ if(k==="class") e.className=attrs[k]; else if(k.startsWith("on")) e.addEventListener(k.slice(2), attrs[k]); else if(attrs[k]!==false && attrs[k]!=null) e.setAttribute(k, attrs[k]); }
  for (const kid of kids){ if (kid==null) continue; e.append(kid.nodeType ? kid : document.createTextNode(kid)); } return e; }
const dayKey = t => { const d=new Date(t); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`; };
const fmtDay = k => new Date(k+"T12:00").toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
const fmtTime = t => new Date(t).toLocaleTimeString([], {hour:"numeric", minute:"2-digit"});
const localInput = t => { const d=new Date(t); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };

// ---------------- pure analysis (tested) ----------------
function inRange(entries, from, to){ return entries.filter(e=>e.t>=from && e.t<to); }
function countBy(list, f){ const m=new Map(); for(const x of list){ const k=f(x); if(k==null||k==="") continue; m.set(k,(m.get(k)||0)+1);} return [...m.entries()].sort((a,b)=>b[1]-a[1]); }
function functionOf(consequence){ const c = CONSEQUENCES.find(x=>x[0]===consequence); return c ? c[1] : "none"; }
function hourBand(t){ const h=new Date(t).getHours(); return h<10?"Before 10am":h<12?"10am–noon":h<14?"Noon–2pm":"After 2pm"; }
function patterns(entries){
  const inc = entries.filter(e=>e.type==="incident");
  const fn = countBy(inc, e=>{ const f=functionOf(e.consequence); return f==="none"?null:f; });
  return {n:inc.length, antecedents:countBy(inc,e=>e.antecedent), activities:countBy(inc,e=>e.activity),
          times:countBy(inc,e=>hourBand(e.t)), functions:fn, fnTotal:fn.reduce((s,x)=>s+x[1],0),
          intensity:countBy(inc,e=>["","Low","Moderate","High"][e.intensity||0])};
}
function summarize(name, entries, from, to){
  const cur = inRange(entries, from, to), span = to-from, prev = inRange(entries, from-span, from);
  const days = Math.max(1, Math.round(span/864e5));
  const inc = cur.filter(e=>e.type==="incident"), pinc = prev.filter(e=>e.type==="incident");
  const wins = cur.filter(e=>e.type==="win"), goals = cur.filter(e=>e.type==="goal"), rs = cur.filter(e=>e.type==="restore");
  const P = patterns(cur), parts = [];
  const range = `${new Date(from).toLocaleDateString(undefined,{month:"long",day:"numeric"})} to ${new Date(to-1).toLocaleDateString(undefined,{month:"long",day:"numeric",year:"numeric"})}`;
  parts.push(`Summary for ${name}, ${range} (${days} day${days>1?"s":""}).`);
  if (!cur.length){ parts.push("No entries were logged in this period."); return parts.join("\n\n"); }
  let s = `${inc.length} behavior incident${inc.length===1?" was":"s were"} logged`;
  if (pinc.length || prev.length){
    const d = inc.length - pinc.length;
    s += d<0 ? `, down from ${pinc.length} in the previous ${days} days` : d>0 ? `, up from ${pinc.length} in the previous ${days} days` : `, the same as the previous ${days} days`;
  }
  s += ".";
  if (inc.length){
    const a = P.antecedents[0], act = P.activities[0], tm = P.times[0];
    if (a) s += ` The most common situation beforehand was "${a[0].toLowerCase()}" (${a[1]} of ${inc.length}).`;
    if (act) s += ` Incidents happened most often during ${act[0].toLowerCase()}`+(tm?`, usually ${tm[0].toLowerCase()}`:"")+".";
    const hi = inc.filter(e=>e.intensity===3).length;
    s += hi ? ` ${hi} ${hi===1?"was":"were"} rated high intensity.` : " None were rated high intensity.";
  }
  parts.push(s);
  if (wins.length){
    const top = countBy(wins,e=>e.skill)[0];
    parts.push(`${wins.length} success${wins.length===1?" was":"es were"} recorded`+(top?`, most often "${top[0].toLowerCase()}"`:"")+".");
  }
  const byGoal = new Map(); goals.forEach(g=>{ if(!byGoal.has(g.goal)) byGoal.set(g.goal,[]); byGoal.get(g.goal).push(g); });
  for (const [goal, list] of byGoal){
    const sorted = list.slice().sort((a,b)=>a.t-b.t), avg = Math.round(sorted.reduce((s,x)=>s+x.score,0)/sorted.length);
    const first = sorted[0].score, last = sorted[sorted.length-1].score;
    parts.push(`Goal "${goal}": ${sorted.length} data point${sorted.length===1?"":"s"}, averaging ${avg}%`+(sorted.length>1?`, moving from ${first}% to ${last}%.`:"."));
  }
  parts.push(...moreSummary(cur));
  if (rs.length){
    const kept = rs.filter(r=>r.status==="kept").length, missed = rs.filter(r=>r.status==="missed").length, open = rs.length-kept-missed;
    parts.push(`${rs.length} restorative conversation${rs.length===1?" was":"s were"} held. Agreements: ${kept} kept, ${missed} not kept, ${open} still open.`);
  }
  if (P.fnTotal >= 3){
    const f = P.functions[0];
    parts.push(`Pattern to discuss with the team: in ${pct(f[1],P.fnTotal)}% of incidents with a recorded response, the response was consistent with "${FUNCTIONS[f[0]].toLowerCase()}". This is a pattern in the log, not a completed functional behavior assessment.`);
  }
  return parts.join("\n\n");
}

// ---------------- record chain ----------------
// Every entry is linked to the one before it by a SHA-256 fingerprint. Editing, deleting or reordering an
// entry from a past day breaks the links, and BridgeLog says where. Notes, voids, kept/not-kept and
// follow-ups are allowed later changes, so they're left out of the fingerprint.
const CHAIN_SKIP = new Set(["addenda","voided","status","followups","ch","chFrom"]);
const GENESIS = "0".repeat(64);
let chainState = null;
async function sha(text){ const b=await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join(""); }
function canon(e){ const o={}; Object.keys(e).filter(k=>!CHAIN_SKIP.has(k)).sort().forEach(k=>{ o[k]=e[k]; }); return JSON.stringify(o); }
const linkOf = (prev, e) => sha(prev+"|"+canon(e));
const chainCode = h => h && h!==GENESIS ? (h.slice(0,4)+"-"+h.slice(4,8)).toUpperCase() : "none yet";
function chainItems(d){ return [...d.entries.filter(e=>e.ch).map(e=>({i:e.ch.i, e})), ...((d.chain&&d.chain.gone)||[]).map(g=>({i:g.i, g}))].sort((a,b)=>a.i-b.i); }
async function extendChain(d){
  if (!d || !Array.isArray(d.entries)) return;
  const c = d.chain ||= {started: Date.now(), n: 0, head: GENESIS, gone: []};
  const items = chainItems(d);
  // Today's entries may still be edited, so their links are refreshed. Past days are never re-linked:
  // a past entry whose content no longer matches its link is left as evidence.
  const k = items.findIndex(it=>it.e && !isLocked(it.e));
  if (k>=0){
    let prev = items[k].e.ch.prev;
    for (let j=k;j<items.length;j++){
      const it=items[j];
      if (it.g){ prev=it.g.h; continue; }
      const e=it.e;
      if (isLocked(e) && await linkOf(e.ch.prev, e)!==e.ch.h){ prev=e.ch.h; continue; }
      if (e.ch.prev!==prev || !isLocked(e)){ e.ch.prev=prev; e.ch.h=await linkOf(prev, e); }
      prev=e.ch.h;
    }
    c.head=prev;
  }
  const fresh = d.entries.filter(e=>!e.ch).sort((a,b)=>((a.c||a.t)-(b.c||b.t)) || String(a.id).localeCompare(String(b.id)));
  for (const e of fresh){ const prev=c.head||GENESIS; const h=await linkOf(prev, e); e.ch={i:c.n, prev, h}; c.n++; c.head=h; }
}
async function verifyChain(d=db){
  const c=d.chain;
  if (!c) return {ok:true, n:0, problems:[], head:null, started:null};
  const items=chainItems(d), problems=[]; let prev=GENESIS, expect=0, skipOrder=false;
  for (const it of items){
    if (it.i!==expect){ problems.push({kind:"missing", from:expect, to:it.i-1}); skipOrder=true; }
    if (it.e){
      const e=it.e;
      if (e.ch.prev!==prev && !skipOrder) problems.push({kind:"order", e});

// Same fingerprint for an entry whether or not later, allowed changes were made (notes, voiding, kept/not kept).
async function fingerprint(e){
  const {addenda, voided, status, followups, ch, chFrom, ...orig} = e;
  const canon = JSON.stringify(Object.keys(orig).sort().reduce((o,k)=>(o[k]=orig[k],o),{}));
  return toB64(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(canon)));
}
// BugNet's rule: check the records against something the app doesn't control, a backup file.
async function recordCheck(backup){
  const at = backup.savedAt || 0, cur = new Map(db.entries.map(e=>[e.id,e]));
  const res = {checked:backup.entries.length, missing:[], changedLocked:[], changedSameDay:0, voidedSince:0, notesSince:0, newSince:0, at};
  for (const b of backup.entries){
    const c = cur.get(b.id);
    if (!c){ res.missing.push(b); continue; }
    if (await fingerprint(c) !== await fingerprint(b)){
      if (at && dayKey(b.c||b.t) < dayKey(at)) res.changedLocked.push(c); else res.changedSameDay++;
    }
    if (c.voided && !b.voided) res.voidedSince++;
    if ((c.addenda||[]).length > (b.addenda||[]).length) res.notesSince++;
  }
  const ids = new Set(backup.entries.map(e=>e.id)); res.newSince = db.entries.filter(e=>!ids.has(e.id)).length;
  return res;
}

async function readBackupFile(file){
  const text = await file.text(); let d; try{ d = JSON.parse(text); }catch(e){ throw new Error("That file isn't a BridgeLog backup."); }
  if (d && d.enc){
    return new Promise((resolve,reject)=>{ askPasscode("This file is encrypted", async pass=>{
      let key, out; try{ key = await deriveKey(pass, fromB64(d.salt)); out = await unseal(d, key); }catch(e){ throw new Error("That passcode didn't work for this file."); }
      resolve({data:out, key, salt:d.salt}); }); dlg.addEventListener("close", ()=>reject(new Error("cancelled")), {once:true}); });
  }
  return {data:d};
}

function toCSV(entries){
  const rows=[["student","type","date","time","entered","logged by","detail","value","activity","before","after","intensity","minutes","score","notes","added notes","voided","all details"]];
  const SKIP=new Set(["id","student","type","t","c","by","ch","chFrom","addenda","voided"]);
  const all = e => { const o={}; for (const k in e) if (!SKIP.has(k) && e[k]!=="" && e[k]!=null) o[k]=e[k]; return Object.keys(o).length ? JSON.stringify(o) : ""; };

  entries.slice().sort((a,b)=>a.t-b.t).forEach(e=>{ const st=db.students.find(x=>x.id===e.student); const d=new Date(e.t);
    rows.push([st?.name||"",e.type,dayKey(e.t),d.toTimeString().slice(0,5),new Date(e.c||e.t).toLocaleString(),e.by||"",e.behavior||e.skill||e.goal||e.agreement||e.care||(e.interventions||[]).join("; ")||"",csvValue(e),e.activity||"",e.antecedent||"",e.consequence||"",e.intensity||"",e.duration||"",e.score??"",[e.description||e.saw, e.notes||e.what].filter(Boolean).join(" · "),(e.addenda||[]).map(a=>new Date(a.t).toLocaleString()+(a.by?` (${a.by})`:"")+": "+a.text).join(" | "),e.voided?("Voided: "+e.voided.reason):"",all(e)]); });
  return rows.map(r=>r.map(cell).join(",")).join("\n");

// Merge never replaces what's here: originals stay as they are, new entries are added, notes and voids combine.
function mergeIn(data){
  const r={newEntries:0,newNotes:0,newStudents:0,joined:0}, idMap={};
  for (const st of data.students){
    let mine = db.students.find(x=>x.id===st.id);
    if (!mine){ const same=db.students.find(x=>!x.sample && x.name.trim().toLowerCase()===String(st.name).trim().toLowerCase()); if (same){ mine=same; idMap[st.id]=same.id; r.joined++; } }
    if (!mine){ db.students.push({...st}); r.newStudents++; }
    else { mine.supports=[...new Set([...(mine.supports||[]),...(st.supports||[])])]; mine.behaviors=[...new Set([...(mine.behaviors||[]),...(st.behaviors||[])])]; mine.goals=[...new Set([...(mine.goals||[]),...(st.goals||[])])]; }
  }
  for (const e of data.entries){
    const mine = db.entries.find(x=>x.id===e.id);
    if (!mine){ const x=JSON.parse(JSON.stringify(e)); if (idMap[x.student]) x.student=idMap[x.student]; if (x.ch){ x.chFrom=x.ch; delete x.ch; } db.entries.push(x); r.newEntries++; continue; }
    const have = new Set((mine.addenda||[]).map(a=>a.t+"|"+a.text));
    for (const a of (e.addenda||[])) if (!have.has(a.t+"|"+a.text)){ (mine.addenda ||= []).push(a); r.newNotes++; }
    if (mine.addenda) mine.addenda.sort((a,b)=>a.t-b.t);
    if (e.voided && (!mine.voided || e.voided.t < mine.voided.t)) mine.voided = e.voided;
    if (mine.type==="restore" && mine.status==="open" && e.status && e.status!=="open") mine.status = e.status;
  }
  if (!db.current && db.students.length) db.current = db.students[0].id;
  return r;
}

// Runs four times a second; only updates text unless an interval rolls over or an alert is due.
function tick(quiet){

function moreSummary(cur){
  const out=[], by=(list,f)=>{ const m=new Map(); list.forEach(x=>{ const k=f(x); if(!m.has(k)) m.set(k,[]); m.get(k).push(x); }); return m; };

    const total=list.reduce((a,e)=>a+e.count,0), hrs=list.reduce((a,e)=>a+(e.end-e.t),0)/36e5;
    out.push(`"${b}" was counted in ${list.length} session${list.length===1?"":"s"}: ${total} time${total===1?"":"s"} in all`+(hrs>=0.05?`, about ${Math.round(total/hrs*10)/10} per hour of observation.`:"."));
  }
  for (const [b,list] of by(cur.filter(e=>e.type==="duration"), e=>e.behavior)){
    const sec=list.map(e=>e.seconds), avg=sec.reduce((a,x)=>a+x,0)/sec.length;
    out.push(`"${b}" was timed ${list.length} time${list.length===1?"":"s"}, averaging ${fmtMins(avg*1000)} (longest ${fmtMins(Math.max(...sec)*1000)}).`);
  }
  for (const [b,list] of by(cur.filter(e=>e.type==="interval"), e=>e.behavior+"|"+e.method)){
    const s=list.slice().sort((a,b)=>a.t-b.t), avg=Math.round(s.reduce((a,e)=>a+e.pct,0)/s.length);
    out.push(`"${s[0].behavior}" (${METHOD[s[0].method].toLowerCase()}): ${s.length} session${s.length===1?"":"s"}, occurring in ${avg}% of intervals on average`+(s.length>1?`, from ${s[0].pct}% to ${s[s.length-1].pct}%.`:"."));
  }
  const care=cur.filter(e=>e.type==="care");
  if (care.length){ const c=countBy(care,e=>e.care).map(([k,n])=>`${k.toLowerCase()} ${n}`).join(", "); let line=`Care log: ${c}.`;
    const t=care.filter(e=>e.care==="Toileting" && e.detail), ok=t.filter(e=>/in toilet/.test(e.detail)).length;
    if (t.length) line+=` ${ok} of ${t.length} toileting entries were in the toilet.`; out.push(line); }
  const sz=cur.filter(e=>e.type==="seizure");
  if (sz.length){ const timed=sz.filter(e=>e.seconds!=null), resc=sz.filter(e=>e.rescue).length;
    out.push(`${sz.length} seizure${sz.length===1?" was":"s were"} logged`+(timed.length?`, the longest lasting ${fmtMins(Math.max(...timed.map(e=>e.seconds))*1000)}`:"")+`. Rescue medicine was given ${resc} time${resc===1?"":"s"}.`); }
  const em=cur.filter(e=>e.type==="emergency");
  if (em.length){ const mins=em.reduce((a,e)=>a+(e.minutes||0),0);
    out.push(`${em.length} emergency intervention${em.length===1?" was":"s were"} documented, ${mins} minute${mins===1?"":"s"} in total. Each has its own report.`); }
  return out;

        sentence+=` Independent responses: ${half(tr)}% overall`+(late.length&&early.length&&list.length>1?`, ${half(early)}% in the first half of the period and ${half(late)}% in the second`:"")+"."+(top?` The most common prompt needed was ${promptName(top[0]).toLowerCase()}.`:""); }
      b+=`<p>${esc(sentence)}</p>${goalChart(list, from, to, target)}`;
      b+=`<table><tr><th>Date</th><th>Score</th><th>Detail</th></tr>${list.map(e=>`<tr><td>${esc(new Date(e.t).toLocaleDateString(undefined,{month:"short",day:"numeric"}))} ${esc(fmtTime(e.t))}</td><td>${e.score}%</td><td>${esc(e.trials?.length?`${e.trials.filter(x=>x==="I").length} of ${e.trials.length} independent`:e.steps?.length?`${e.steps.filter(x=>x.l==="I").length} of ${e.steps.length} steps independent`:(e.note||e.notes||""))}</td></tr>`).join("")}</table>`;
      const steps=list.filter(e=>e.steps?.length);
      if (steps.length){ const L=steps[steps.length-1]; b+=`<table><tr><th>Step</th><th>Latest prompt level (${esc(new Date(L.t).toLocaleDateString(undefined,{month:"short",day:"numeric"}))})</th></tr>${L.steps.map(x=>`<tr><td>${esc(x.s)}</td><td>${esc(x.l?promptName(x.l):"Not scored")}</td></tr>`).join("")}</table>`; }
    }
    b+=`<p class="sub" style="margin:10px 0 0">Notes for the case manager</p><div class="box" contenteditable="true" aria-label="Notes for the case manager"></div></div>`;
  }
  const extra=moreSummary(cur), inc=cur.filter(e=>e.type==="incident"), wins=cur.filter(e=>e.type==="win");
  if (extra.length || inc.length || wins.length){
    b+=`<div class="goal"><h2>Behavior data</h2>`;
    if (inc.length || wins.length){
      const weeks=[]; for (let w=from; w<to; w+=6048e5) weeks.push([w, Math.min(to, w+6048e5)]);
      b+=`<table><tr><th>Week of</th><th>Tough moments</th><th>Wins</th></tr>${weeks.map(([a,c])=>`<tr><td>${new Date(a).toLocaleDateString(undefined,{month:"short",day:"numeric"})}</td><td>${inRange(inc,a,c).length}</td><td>${inRange(wins,a,c).length}</td></tr>`).join("")}</table>`;
    }
    b+=extra.map(x=>`<p>${esc(x)}</p>`).join("")+`</div>`;
  }
  b+=`<p class="foot">Prepared from BridgeLog records kept on a school device. Figures reflect what was logged: a day with no entries is a gap in logging, not necessarily in behavior. It contains only logged data, not the IEP itself.</p><p class="foot">Record fingerprint: <b>${chainCode(db.chain&&db.chain.head)}</b>. In BridgeLog, Data tab, enter this code to confirm this page matches the records it came from.</p>`;
  return pageHTML(`Goal data summary, ${s.name}`, b);
}
function berHTML(e){
  const s=db.students.find(x=>x.id===e.student)||{name:""}, f=e.followups||{};
  const row=(k,v)=>`<tr><td class="k">${esc(k)}</td><td>${esc(v||"")}</td></tr>`;
  let b=`<h1>Behavioral emergency report</h1><p class="sub">Student: ${esc(s.name)} · recorded in BridgeLog${e.by?` by ${esc(e.by)}`:""}, entered ${esc(fmtDT(e.c||e.t))}</p><table>`;
  BER_FIELDS.forEach(([k,label])=>{ b+=row(label, k==="interventions"?(e.interventions||[]).join(", "):k==="t"?fmtDT(e.t):k==="minutes"?(e.minutes!=null?`${e.minutes} min`:""):e[k]); });
  b+=`</table><h2>Follow-up</h2><table>${row("Forwarded to administrator", f.admin?fmtDT(f.admin.t):"")}${row("Parent or guardian notified", f.parent?fmtDT(f.parent.t):"")}${e.bip==="No"?row("IEP team meeting scheduled", f.iep?fmtDT(f.iep.t):""):""}</table>`;
  if ((e.addenda||[]).length) b+=`<h2>Added notes</h2><table>${e.addenda.map(a=>row(fmtDT(a.t)+(a.by?` · ${a.by}`:""), a.text)).join("")}</table>`;
  b+=`<div class="sig"><div>Staff signature and date</div><div>Administrator signature and date</div></div><div class="sig"><div>Parent or guardian signature and date</div></div>
  <p class="foot">California Education Code 56521.1 requires a behavioral emergency report to be completed immediately, kept in the student's file and forwarded to a designated administrator, with the parent or guardian notified within one school day. Use your district's official form if it requires one; this page lists what BridgeLog recorded.</p><p class="foot">Record fingerprint: <b>${chainCode(db.chain&&db.chain.head)}</b>. In BridgeLog, Data tab, enter this code to confirm this page matches the records it came from.</p>`;
  return pageHTML(`Behavioral emergency report, ${s.name}`, b);
}

// ---------------- wiring ----------------
const views = {timeline:vTimeline, patterns:vPatterns, repair:vRepair, summary:vSummary, data:vData};
let tab = "timeline";
function render(){
  const sel=$("#student"); sel.replaceChildren(...db.students.map(s=>el("option",{value:s.id},s.name)));
  if (!db.students.length) sel.append(el("option",{value:""},"No students yet"));
  if (db.current && !stu()) db.current = db.students[0]?.id || null;
  if (!db.current && db.students.length) db.current = db.students[0].id;
  sel.value = db.current || "";
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===tab)));
  Object.keys(views).forEach(k=>{ $("#v-"+k).hidden = k!==tab; });
  views[tab]();
  renderRunning();
}
$("#student").addEventListener("change", e=>{ db.current=e.target.value; showSupports=null; save(); render(); });
$("#addStudentBtn").addEventListener("click", addStudent);
document.querySelectorAll("[data-log]").forEach(b=>b.addEventListener("click",()=>({incident:logIncident,win:logWin,goal:logGoal,restore:()=>logRestore(),time:openTimers,care:openSupports})[b.dataset.log]()));
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{ tab=b.dataset.tab; render(); }));
const boot = load();
if (boot && boot.enc){ render(); showLock(boot); }
else { if (!db.students.length && boot==="empty") addSample();   // first visit opens in a filled-in state
  render(); checkChainOnOpen(); }
</script>

</body>
