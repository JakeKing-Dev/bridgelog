<title>BridgeLog</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: phone-first app shell. Student bar on top, one view at a time, quick-log buttons always one tap away. */
/* Calm, low-glare palette: soft sage ground, muted lavender-blue accent, clay (not alarm red) for incidents. */
:root{
  --bg:#f1f4f0; --surface:#fbfcf9; --ink:#2e3a3a; --muted:#6b7877; --line:#dde4de;
  --accent:#5b6fa8; --accent-ink:#fbfcf9; --accent-soft:#e6e9f4;
  --incident:#b06a4f; --incident-soft:#f4e6de; --win:#4f8a63; --win-soft:#e3efe4;
  --goal:#4f7fa6; --goal-soft:#e2ecf3; --restore:#8a6fa8; --restore-soft:#eee7f4;
  --font:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Lexend",system-ui,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1c2228; --surface:#242b32; --ink:#e3e7e4; --muted:#a3aeac; --line:#353e46;
  --accent:#9fb0e0; --accent-ink:#1c2228; --accent-soft:#2c3446;
  --incident:#e0a48b; --incident-soft:#3d2f2a; --win:#97c9a4; --win-soft:#26362c;
  --goal:#96bddb; --goal-soft:#26333e; --restore:#c3acdf; --restore-soft:#332c3d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1c2228; --surface:#242b32; --ink:#e3e7e4; --muted:#a3aeac; --line:#353e46;
  --accent:#9fb0e0; --accent-ink:#1c2228; --accent-soft:#2c3446;
  --incident:#e0a48b; --incident-soft:#3d2f2a; --win:#97c9a4; --win-soft:#26362c;
  --goal:#96bddb; --goal-soft:#26333e; --restore:#c3acdf; --restore-soft:#332c3d; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:300 16.5px/1.6 var(--font);letter-spacing:.005em}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 96px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-size:1.45rem;font-weight:600;color:var(--accent)}
.brand span{font-size:.8rem;color:var(--muted)}
.local{font:500 .72rem var(--mono);color:var(--accent);background:var(--accent-soft);padding:4px 8px;border-radius:999px}
.studentbar{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;width:100%}
textarea{min-height:64px;resize:vertical}
select:focus-visible,input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.studentbar select{font-weight:700}
button{font:500 .95rem var(--font);border-radius:var(--r);border:1.5px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{background:transparent}
button.small{padding:6px 10px;font-size:.82rem}
.quick{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:14px}
.quick button{display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:16px;border-width:0;text-align:left;border-radius:20px}
.quick button small{font-weight:400;font-size:.78rem;opacity:.85}
.ic,.logo{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic{width:30px;height:30px;margin-bottom:6px}
.ic .dot{fill:currentColor}
.logo{width:28px;height:28px;color:var(--accent);align-self:center;stroke-width:2}
.brand{align-items:center}
.q-incident{background:var(--incident-soft);color:var(--incident)}
.q-win{background:var(--win-soft);color:var(--win)}
.q-goal{background:var(--goal-soft);color:var(--goal)}
.q-restore{background:var(--restore-soft);color:var(--restore)}
nav.tabs{display:flex;gap:4px;margin-top:18px;border-bottom:1.5px solid var(--line);overflow-x:auto}
nav.tabs button{border:0;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);padding:10px 14px;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
section.view{padding-top:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row > *{flex:1 1 160px;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px}
.kpi b{display:block;font:400 1.7rem var(--mono);font-variant-numeric:tabular-nums}
.kpi span{font-size:.8rem;color:var(--muted)}
.kpi .delta{font:500 .75rem var(--mono)}
.day{margin-top:14px}
.day h3{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.entry{display:grid;grid-template-columns:6px minmax(0,1fr) auto;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:8px}
.entry .stripe{border-radius:4px}
.entry .t{font:500 .78rem var(--mono);color:var(--muted)}
.entry p{margin:2px 0 0;font-size:.92rem;color:var(--muted)}
.entry .head{font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.84rem;border:1.5px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--surface);cursor:pointer;font-weight:400}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:500}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.84rem;font-weight:500;color:var(--muted)}
.bar{height:10px;border-radius:5px;background:var(--accent-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bars{display:flex;flex-direction:column;gap:10px}
.bars .lab{display:flex;justify-content:space-between;font-size:.88rem}
.bars .lab span{font:500 .82rem var(--mono);color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.summary{white-space:pre-wrap;font-size:1rem;line-height:1.6}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pill{font:500 .72rem var(--mono);padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-open{background:var(--restore-soft);color:var(--restore)}
.p-kept{background:var(--win-soft);color:var(--win)}
.p-missed{background:var(--incident-soft);color:var(--incident)}
.gridhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.gridhead .legend{margin:0}
.mini{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px;margin-right:3px}
.lg-i{color:var(--incident)} .lg-w{color:var(--win)}
.weeks{display:grid;grid-template-columns:auto repeat(5,minmax(0,1fr));gap:6px;align-items:stretch}
.dow{font-size:.75rem;color:var(--muted);text-align:center}
.wk-label{font-size:.72rem;color:var(--muted);align-self:center;padding-right:4px;white-space:nowrap}
.day-tile{border-radius:14px;min-height:58px;padding:6px 8px;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg);border:1.5px solid transparent}
.day-tile.good{background:var(--win-soft)} .day-tile.hard{background:var(--incident-soft)} .day-tile.even{background:var(--accent-soft)}
.day-tile.future{opacity:.35} .day-tile.today{border-color:var(--accent)}
.dnum{font-size:.78rem;color:var(--muted)}
.counts{display:flex;gap:6px;flex-wrap:wrap;font-size:.85rem;font-variant-numeric:tabular-nums}
.growth{display:flex;flex-direction:column;gap:5px}
.growth .lab{display:flex;justify-content:space-between;gap:10px;font-size:.92rem}
.growth .lab b{font-weight:500;color:var(--goal)}
.gbar{height:14px;border-radius:7px;background:var(--goal-soft);overflow:hidden}
.gbar i{display:block;height:100%;border-radius:7px;background:var(--goal)}
.gnote{font-size:.8rem;color:var(--muted)}
@media (max-width:420px){.wk-label{font-size:.64rem}.day-tile{min-height:52px;padding:5px}.counts{font-size:.78rem;gap:3px}.mini{width:13px;height:13px}}
.empty{text-align:center;color:var(--muted);padding:28px 12px}
#lock{position:fixed;inset:0;background:var(--bg);z-index:40;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
.lockcard{width:min(380px,100%);display:flex;flex-direction:column;gap:12px;align-items:stretch;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:28px}
.lockcard .logo{align-self:center}
.lockcard h2{margin:0;font-size:1.3rem;font-weight:500}
.status{display:flex;align-items:center;gap:8px;font-weight:500}
.status i{width:10px;height:10px;border-radius:50%;display:inline-block}
.check-ok{background:var(--win-soft);border-radius:14px;padding:12px 14px;color:var(--ink)}
.check-bad{background:var(--incident-soft);border-radius:14px;padding:12px 14px;color:var(--ink)}
.check-bad ul{margin:6px 0 0;padding-left:18px}
.kv{display:grid;grid-template-columns:minmax(90px,34%) minmax(0,1fr);gap:10px;font-size:.92rem;padding:6px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--muted)} .kv b{font-weight:400;overflow-wrap:anywhere}
.addendum{border-left:3px solid var(--accent);padding:2px 0 2px 12px} .addendum p{margin:2px 0 0}
.entry.voided{opacity:.6} .entry.voided .head{text-decoration:line-through}
dialog{border:0;border-radius:24px;padding:0;width:min(560px,calc(100vw - 24px));background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(40,50,55,.35)}
dialog form{padding:18px;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
dialog h2{margin:0;font-size:1.2rem}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);padding:11px 18px;border-radius:999px;font-size:.9rem;z-index:20}
.confirm{border-radius:16px;border:1.5px solid var(--incident);background:var(--incident-soft);color:var(--incident);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (max-width:620px){
  .quick{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}

</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 15h19"/><path d="M4 15C6.5 7.5 17.5 7.5 20 15"/><path d="M8.5 15v-4.4M12 15V9.4M15.5 15v-4.4"/><path d="M6 15v5M18 15v5"/></svg><b>BridgeLog</b><span>behavior, progress and repair, in one timeline</span></div>
    <span class="local" title="Nothing is sent anywhere. Back up from the Data tab.">● Saved on this device only</span>
  </header>

  <div class="studentbar">
    <label for="student" class="f" style="flex:1 1 220px">Student
      <select id="student" aria-label="Choose student"></select>
    </label>
    <button id="addStudentBtn" class="ghost" style="align-self:flex-end">+ Student</button>
  </div>

  <div class="quick" role="group" aria-label="Quick log">
    <button class="q-incident" data-log="incident"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-7.96A6 6 0 0 0 6.2 9.4 4.3 4.3 0 0 0 7 18z"/></svg>Incident<small>what happened, before & after</small></button>
    <button class="q-win" data-log="win"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-9"/><path d="M12 12C12 8.2 9.4 5.5 5 5.5c0 4.2 2.8 6.5 7 6.5z"/><path d="M12 14.5c0-3.3 2.4-5.5 6.5-5.5 0 3.7-2.6 5.5-6.5 5.5z"/></svg>Win<small>a success worth noting</small></button>
    <button class="q-goal" data-log="goal"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1" class="dot"/></svg>Goal data<small>score toward an IEP goal</small></button>
    <button class="q-restore" data-log="restore"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 15h19"/><path d="M4 15C6.5 7.5 17.5 7.5 20 15"/><path d="M8.5 15v-4.4M12 15V9.4M15.5 15v-4.4"/><path d="M6 15v5M18 15v5"/></svg>Restorative<small>conversation & agreement</small></button>
  </div>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="timeline" aria-selected="true">Timeline</button>
    <button role="tab" data-tab="patterns" aria-selected="false">Patterns</button>
    <button role="tab" data-tab="repair" aria-selected="false">Restorative</button>
    <button role="tab" data-tab="summary" aria-selected="false">Summary</button>
    <button role="tab" data-tab="data" aria-selected="false">Data</button>
  </nav>

  <section class="view" id="v-timeline"></section>
  <section class="view" id="v-patterns" hidden></section>
  <section class="view" id="v-repair" hidden></section>
  <section class="view" id="v-summary" hidden></section>
  <section class="view" id="v-data" hidden></section>
</div>

<dialog id="dlg"><form id="dlgForm" method="dialog"></form></dialog>
<div id="lock" hidden>
  <form id="lockForm" class="lockcard" autocomplete="off">
    <svg class="logo" viewBox="0 0 24 24" aria-hidden="true" style="width:44px;height:44px"><path d="M2.5 15h19"/><path d="M4 15C6.5 7.5 17.5 7.5 20 15"/><path d="M8.5 15v-4.4M12 15V9.4M15.5 15v-4.4"/><path d="M6 15v5M18 15v5"/></svg>
    <h2>BridgeLog is locked</h2>
    <p style="margin:0;color:var(--muted)">Enter your passcode to open your logs.</p>
    <label class="f" for="lockPass">Passcode<input id="lockPass" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Unlock</button>
    <p id="lockMsg" role="status" style="margin:0;min-height:1.4em;color:var(--incident)"></p>
    <button type="button" class="ghost small" id="lockForgot">Forgot passcode?</button>
    <div id="lockConfirm" class="confirm" hidden>The data is encrypted with your passcode, so it can't be recovered without it. You can erase this device and restore an older backup instead.
      <button type="button" class="small" id="lockErase">Erase this device</button><button type="button" class="small ghost" id="lockKeep">Keep trying</button></div>
  </form>
</div>

<script>
// ---------------- vocab ----------------
const ANTECEDENTS = ["Demand or task given","Transition","Told no / item denied","Peer conflict","Unstructured time","Adult attention elsewhere","Noise or crowding","Change in routine","Other"];
const CONSEQUENCES = [
  ["Redirected to task","none"],["Break given","escape"],["Task removed or changed","escape"],["Left the area","escape"],
  ["Adult attention / talk","attention"],["Peer attention","attention"],["Item or activity given","tangible"],
  ["Planned ignoring","sensory"],["Continued without response","sensory"],["Other","none"]];
const FUNCTIONS = {escape:"Escape or avoid something",attention:"Get attention",tangible:"Get an item or activity",sensory:"Sensory / automatic"};
const ACTIVITIES = ["Arrival","Morning work","Reading","Math","Specials","Lunch","Recess","Small group","Independent work","Dismissal","Other"];
const WIN_SKILLS = ["Followed directions","Used a coping strategy","Asked for help","Asked for a break","Kind to a peer","Stayed with the task","Smooth transition","Tried something hard"];
const RQ = ["What happened?","What were you thinking at the time?","Who has been affected, and how?","What do you need, and what do they need?","What can be done to make things right?"];

// ---------------- storage ----------------
const KEY = "bridgelog.v1";
let db = {students:[], entries:[], current:null, sample:false};
const META = "bridgelog.meta";
let cryptoKey = null, saltB64 = null, locked = false, saveChain = Promise.resolve();
function getMeta(){ try{ return JSON.parse(localStorage.getItem(META)||"{}"); }catch(e){ return {}; } }
function setMeta(patch){ try{ localStorage.setItem(META, JSON.stringify({...getMeta(), ...patch})); }catch(e){} }
const toB64 = buf => { const b=new Uint8Array(buf); let s=""; for (let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null, b.subarray(i,i+0x8000)); return btoa(s); };
const fromB64 = str => Uint8Array.from(atob(str), c=>c.charCodeAt(0));
async function deriveKey(pass, salt){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt, iterations:210000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function seal(obj, key=cryptoKey, salt=saltB64){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return {bridgelog:1, enc:"AES-GCM-256", kdf:"PBKDF2-SHA256-210000", salt, iv:toB64(iv), data:toB64(ct)};
}
async function unseal(env, key){ const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:fromB64(env.iv)}, key, fromB64(env.data)); return JSON.parse(new TextDecoder().decode(pt)); }
// Returns "empty", "plain", or the encrypted envelope (which needs the passcode).
function load(){ try{ const s=localStorage.getItem(KEY); if(!s) return "empty"; const o=JSON.parse(s); if (o && o.enc) return o; db=o; return "plain"; }catch(e){ return "empty"; } }
function askPersist(){
  const m=getMeta(); if (m.persistAsked || !navigator.storage?.persist) return;
  if (!db.students.some(x=>!x.sample)) return;
  setMeta({persistAsked:true}); navigator.storage.persist().then(ok=>setMeta({persisted:ok})).catch(()=>{});
}
function save(){
  if (locked) return saveChain;
  try{ askPersist(); }catch(e){}           // never overwrite stored data while the app is locked
  const snapshot = db, key = cryptoKey, salt = saltB64;
  saveChain = saveChain.then(async ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(key ? await seal(snapshot, key, salt) : snapshot)); }
    catch(e){ toast("Couldn't save on this device. Download a backup from the Data tab."); } });
  return saveChain;
}
// ---- passcode lock
let lastActive = Date.now();
["pointerdown","keydown"].forEach(ev=>document.addEventListener(ev,()=>{ lastActive=Date.now(); }, {passive:true}));
const lockMinutes = () => getMeta().lockMinutes || 5;
setInterval(()=>{ if (cryptoKey && !locked && Date.now()-lastActive > lockMinutes()*60e3) lockNow(); }, 20e3);
document.addEventListener("visibilitychange",()=>{ if (document.visibilityState==="visible" && cryptoKey && !locked && Date.now()-lastActive > lockMinutes()*60e3) lockNow(); });
async function lockNow(){
  await saveChain;
  let env; try{ env = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  if (!env || !env.enc) return;
  if (dlg.open) dlg.close();
  locked = true; cryptoKey = null; db = {students:[], entries:[], current:null};
  document.querySelectorAll("section.view").forEach(sec=>sec.replaceChildren());   // drop every rendered record, not just the visible tab
  render(); showLock(env);
}
function showLock(env){
  locked = true;
  const box = $("#lock"); box.hidden = false;
  const inp = $("#lockPass"), msg = $("#lockMsg"); inp.value=""; msg.textContent=""; setTimeout(()=>inp.focus(), 50);

function summarize(name, entries, from, to){

  parts.push(`Summary for ${name}, ${range} (${days} day${days>1?"s":""}).`);
  if (!cur.length){ parts.push("No entries were logged in this period."); return parts.join("\n\n"); }
  let s = `${inc.length} behavior incident${inc.length===1?" was":"s were"} logged`;

    const d = inc.length - pinc.length;
    s += d<0 ? `, down from ${pinc.length} in the previous ${days} days` : d>0 ? `, up from ${pinc.length} in the previous ${days} days` : `, the same as the previous ${days} days`;

    if (act) s += ` Incidents happened most often during ${act[0].toLowerCase()}`+(tm?`, usually ${tm[0].toLowerCase()}`:"")+".";
    const hi = inc.filter(e=>e.intensity===3).length;

  }
  parts.push(s);
  if (wins.length){
    const top = countBy(wins,e=>e.skill)[0];

  }

    const f = P.functions[0];
    parts.push(`Pattern to discuss with the team: in ${pct(f[1],P.fnTotal)}% of incidents with a recorded response, the response was consistent with "${FUNCTIONS[f[0]].toLowerCase()}". This is a pattern in the log, not a completed functional behavior assessment.`);

}

// Same fingerprint for an entry whether or not later, allowed changes were made (notes, voiding, kept/not kept).
async function fingerprint(e){
  const {addenda, voided, status, ...orig} = e;
  const canon = JSON.stringify(Object.keys(orig).sort().reduce((o,k)=>(o[k]=orig[k],o),{}));
  return toB64(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(canon)));
}

  for (const b of backup.entries){
    const c = cur.get(b.id);

      if (at && dayKey(b.c||b.t) < dayKey(at)) res.changedLocked.push(c); else res.changedSameDay++;

  form.replaceChildren(el("h2",{},"Turn on passcode protection"),
    el("p",{class:"note"},"Everything on this device will be encrypted with this passcode. If it's forgotten, the data can't be recovered by anyone, including the people who made BridgeLog. Keep backups."),
    field("Passcode (6 or more characters)", p1), field("Type it again", p2),
    el("label",{style:"display:flex;gap:10px;align-items:flex-start;font-size:.9rem"}, ack, "I understand a forgotten passcode means the data can't be recovered."), msg,
    el("div",{class:"actions"}, el("button",{type:"button",class:"ghost",onclick:()=>dlg.close()},"Cancel"), el("button",{type:"submit",class:"primary"},"Turn on")));
  form.onsubmit = async e => { e.preventDefault();
    if (p1.value.length<6){ msg.textContent="Use at least 6 characters."; return; }
    if (p1.value!==p2.value){ msg.textContent="The two passcodes don't match."; return; }
    if (!ack.checked){ msg.textContent="Tick the box to confirm you understand."; return; }
    msg.textContent="Encrypting…"; const salt = crypto.getRandomValues(new Uint8Array(16));
    cryptoKey = await deriveKey(p1.value, salt); saltB64 = toB64(salt); lastActive = Date.now();
    await save(); dlg.close(); render(); toast("Passcode is on. Your logs are encrypted."); };
  dlg.showModal(); p1.focus();
}
function removePasscode(){
  askPasscode("Turn off passcode protection", async pass=>{
    let env; try{ env = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
    try{ await unseal(env, await deriveKey(pass, fromB64(env.salt))); }catch(e){ throw new Error("That passcode didn't work."); }
    cryptoKey=null; saltB64=null; await save(); render(); toast("Passcode is off. Logs are stored unencrypted on this device.");
  });
}
function editStudent(){
  const s=stu(); const beh=el("input",{id:"e-beh",value:s.behaviors.join(", ")}); const goals=el("textarea",{id:"e-goals"}); goals.value=s.goals.join("\n");
  const nm=el("input",{id:"e-name",value:s.name});
  openForm(`Edit ${s.name}`,[field("Name",nm),field("Target behaviors (comma separated)",beh),field("IEP goals (one per line)",goals)],()=>{
    s.name=nm.value.trim()||s.name; s.behaviors=beh.value.split(",").map(x=>x.trim()).filter(Boolean); s.goals=goals.value.split("\n").map(x=>x.trim()).filter(Boolean); toast("Saved"); });
}
function askClear(){
  const v=$("#v-data"); v.querySelector(".confirm")?.remove();
  const c=el("div",{class:"confirm",role:"alert"},"This deletes every student and entry on this device. Download a backup first if you might need it.",
    el("button",{type:"button",class:"small",onclick:()=>{ db={students:[],entries:[],current:null}; save(); render(); toast("Everything deleted"); }},"Delete everything"),
    el("button",{type:"button",class:"small ghost",onclick:()=>c.remove()},"Cancel"));
  v.prepend(c);
}
function emptyState(){
  return el("div",{class:"card empty stack",style:"align-items:center"},
    el("b",{style:"font-size:1.1rem;color:var(--ink)"},"Start with a student"),
    el("p",{style:"margin:0;max-width:44ch"},"Add a student by initials, then log incidents, wins, goal scores and restorative conversations. Or look around with example data first."),
    el("div",{class:"row",style:"justify-content:center;max-width:420px"},
      el("button",{type:"button",class:"primary",onclick:addStudent},"Add a student"),
      el("button",{type:"button",onclick:()=>{ addSample(); render(); }},"Show me an example")));
}
function addSample(){
  const s={id:uid(), name:"Example student", behaviors:["Leaving seat","Shouting out","Refusing work"], goals:["Coin identification (80%)","Asks for a break with card (4/5)"], sample:true};
  db.students.push(s); db.current=s.id;
  let seed=7; const rnd=()=>{ seed=(seed*16807)%2147483647; return seed/2147483647; };
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const now=new Date(); now.setHours(0,0,0,0);
  for (let d=27; d>=0; d--){
    const day=new Date(now.getTime()-d*864e5); if (day.getDay()===0||day.getDay()===6) continue;
    const decline = d/27; const nInc = Math.round(rnd()*2 + decline*2.2);
    for (let i=0;i<nInc;i++){
      const t=day.getTime()+ (rnd()<0.6? (13+rnd()*1.5) : (9+rnd()*3))*36e5;
      const math = rnd()<0.55, ant = math? "Demand or task given" : pick(["Transition","Unstructured time","Peer conflict","Told no / item denied"]);
      const con = rnd()<0.6 ? pick(["Break given","Task removed or changed","Left the area"]) : pick(["Adult attention / talk","Redirected to task","Item or activity given"]);
      db.entries.push({id:uid(),student:s.id,type:"incident",t,behavior:math?"Refusing work":pick(s.behaviors),activity:math?"Math":pick(["Reading","Recess","Small group","Dismissal"]),
        antecedent:ant,consequence:con,intensity:rnd()<0.12?3:rnd()<0.4?2:1,duration:Math.round(1+rnd()*8),notes:""});
    }
    const nWin=Math.round(rnd()*2+(1-decline)*2); for(let i=0;i<nWin;i++) db.entries.push({id:uid(),student:s.id,type:"win",t:day.getTime()+(9+rnd()*6)*36e5,skill:pick(WIN_SKILLS),what:""});
    if (day.getDay()%2===1) db.entries.push({id:uid(),student:s.id,type:"goal",t:day.getTime()+10.5*36e5,goal:s.goals[0],score:Math.min(100,Math.round(30+(1-decline)*40+rnd()*10)),notes:""});
  }
  const r1=new Date(now.getTime()-12*864e5+14*36e5).getTime(), r2=new Date(now.getTime()-3*864e5+13.5*36e5).getTime();
  db.entries.push({id:uid(),student:s.id,type:"restore",t:r1,status:"kept",who:"Student, peer, para",followUp:dayKey(r1+3*864e5),
    answers:["Grabbed the ball from a classmate at recess.","He said it was his turn.","The classmate was upset and recess ended early for both.","He needs a way to show it's his turn; the classmate wants an apology.","Apologize, and use the turn-taking card next recess."],agreement:"Apologize and use the turn-taking card at recess"});
  db.entries.push({id:uid(),student:s.id,type:"restore",t:r2,status:"open",who:"Student, teacher",followUp:dayKey(r2+4*864e5),
    answers:["Ripped up the math worksheet.","It was too hard and everyone was watching.","Himself, and the teacher who had to stop the lesson.","A break card he can use before it gets too hard.","Use the break card, then finish the first three problems."],agreement:"Use the break card before getting overwhelmed, then finish three problems"});
  db.entries.forEach(e=>{ if(!e.c) e.c=e.t; });
  save();
}

// ---------------- wiring ----------------
const views = {timeline:vTimeline, patterns:vPatterns, repair:vRepair, summary:vSummary, data:vData};
let tab = "timeline";
function render(){
  const sel=$("#student"); sel.replaceChildren(...db.students.map(s=>el("option",{value:s.id},s.name)));
  if (!db.students.length) sel.append(el("option",{value:""},"No students yet"));
  if (db.current && !stu()) db.current = db.students[0]?.id || null;
  if (!db.current && db.students.length) db.current = db.students[0].id;
  sel.value = db.current || "";
  document.querySelectorAll("nav.tabs button").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.tab===tab)));
  Object.keys(views).forEach(k=>{ $("#v-"+k).hidden = k!==tab; });
  views[tab]();
}
$("#student").addEventListener("change", e=>{ db.current=e.target.value; save(); render(); });
$("#addStudentBtn").addEventListener("click", addStudent);
document.querySelectorAll("[data-log]").forEach(b=>b.addEventListener("click",()=>({incident:logIncident,win:logWin,goal:logGoal,restore:()=>logRestore()})[b.dataset.log]()));
document.querySelectorAll("nav.tabs button").forEach(b=>b.addEventListener("click",()=>{ tab=b.dataset.tab; render(); }));
const boot = load();
if (boot && boot.enc){ render(); showLock(boot); }
else { if (!db.students.length && boot==="empty") addSample();   // first visit opens in a filled-in state
  render(); }
</script>
